plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('SIGNING_STORE_FILE')
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias,
                         signingKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'io.github.fulu2778.geminimi'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "io.github.fulu2778.geminimi"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += '**'
        }
    }
}

dependencies {
    // libxposed API 102 (new-style, hot reload)
    compileOnly files('libs/libxposed/api.jar')
    implementation files('libs/libxposed/interface.jar')
    implementation files('libs/libxposed/service.jar')

    testImplementation 'junit:junit:4.13.2'
}
